<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Legend</title>

<!--
  Esta pagina existe so' pra mandar quem chega na raiz pro jogo, que mora
  em /rpg-legend/.

  Antes daqui vivia uma copia velha do index.html do jogo, parada desde
  03/08/2026, pedindo css/style.css e js/*.js que nunca existiram na raiz
  deste repositorio. Resultado: quem abria o endereco sem o caminho
  completo via a pagina crua, sem estilo e sem jogo. Ninguem notou porque
  o link divulgado ja' vinha com /rpg-legend/.

  O JavaScript carrega busca e ancora junto: os e-mails de confirmacao e
  de troca de senha mandam links com ?verify= e ?reset=, e perder esses
  parametros no caminho quebraria os dois fluxos.

  Sem `meta refresh` de proposito, mesmo pra quem tem JS desligado: o link
  abaixo esta' sempre visivel e resolve o caso, sem navegacao automatica
  que o leitor de tela anuncia como pagina trocando sozinha.
-->
<script>
  (function () {
    var destino = '/rpg-legend/' + window.location.search + window.location.hash;
    // `replace` e nao `assign`: sem isso o botao "voltar" cai aqui de novo
    // e o jogador fica preso num pingue-pongue.
    window.location.replace(destino);
  })();
</script>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #10121a;
    color: #ecdfc0;
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    padding: 1.5rem;
  }
  h1 { font-size: 1.8rem; margin: 0 0 0.5rem; color: #e8c65a; letter-spacing: 1px; }
  p { margin: 0 0 1.5rem; color: #b9ab86; }
  a {
    display: inline-block;
    padding: 0.7rem 1.4rem;
    border: 1px solid #c9a227;
    border-radius: 4px;
    color: #e8c65a;
    text-decoration: none;
  }
  a:hover { background: rgba(201, 162, 39, 0.15); }
</style>
</head>
<body>
  <main>
    <h1>RPG Legend</h1>
    <p>O jogo est&aacute; a um clique.</p>
    <a href="/rpg-legend/">Entrar no jogo</a>
  </main>
</body>
</html>
