<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Legend mudou de endereço</title>
<link rel="icon" type="image/png" href="img/branding/favicon.png?v=20260809a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<!--
  Esta página substitui o jogo antigo no momento da virada Neon -> Supabase.

  O jogo antigo NÃO ficou "quebrado por acaso": o servidor dele foi
  suspenso de propósito, e sem servidor ele não faz login nem salva. Deixar
  a tela de sempre aqui só produziria erro sem explicação, então ela sai e
  esta entra.

  O original está no histórico do git — `git revert` do commit da virada
  traz ele de volta inteiro. Os arquivos do jogo (js/, css/, img/)
  continuam onde estavam.

  A query string é repassada pro endereço novo. Isso não é enfeite: se
  algum link de e-mail antigo apontar pra cá com `?verify=` ou `?reset=`,
  perder o token deixaria a conta presa sem confirmar e sem erro na tela.
-->
<style>
  :root{
    --ink:#12141c;
    --painel:#1b1f2b;
    --ouro:#c99b3d;
    --ouro-claro:#e8c65a;
    --pergaminho:#ecdfc0;
    --pergaminho-fraco:#b9ab86;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(ellipse at 20% -10%,rgba(201,155,61,.10),transparent 45%),
      radial-gradient(ellipse at 100% 110%,rgba(74,128,115,.10),transparent 50%),
      var(--ink);
    color:var(--pergaminho);
    font-family:'EB Garamond',Georgia,serif;
    font-size:17px;
    line-height:1.6;
    display:grid;
    place-items:center;
    padding:2rem 1.25rem;
  }
  .cartao{
    width:min(34rem,100%);
    background:linear-gradient(180deg,var(--painel),#232838);
    border:1px solid rgba(201,155,61,.35);
    border-radius:.5rem;
    padding:clamp(1.5rem,5vw,2.5rem);
    text-align:center;
    position:relative;
  }
  .cartao::before{
    content:'';position:absolute;inset:5px;
    border:1px solid rgba(201,155,61,.14);
    border-radius:.35rem;pointer-events:none;
  }
  .brasao{width:clamp(4.5rem,18vw,6.5rem);height:auto;margin-bottom:1rem;filter:drop-shadow(0 0 1.5rem rgba(201,155,61,.35))}
  h1{
    font-family:'Cinzel',Georgia,serif;
    font-weight:700;
    font-size:clamp(1.5rem,5vw,2rem);
    line-height:1.2;
    margin:0 0 .75rem;
    color:var(--ouro-claro);
    text-wrap:balance;
  }
  p{margin:0 0 1rem;color:var(--pergaminho-fraco)}
  p.forte{color:var(--pergaminho)}
  .ir{
    display:inline-block;
    margin:.5rem 0 1rem;
    padding:.85rem 2rem;
    background:linear-gradient(180deg,var(--ouro-claro),var(--ouro));
    border:1px solid var(--ouro-claro);
    border-radius:.3rem;
    color:#1a140e;
    font-family:'Cinzel',Georgia,serif;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-decoration:none;
  }
  .ir:hover,.ir:focus-visible{box-shadow:0 0 18px rgba(232,198,90,.45)}
  .ir:focus-visible{outline:2px solid var(--pergaminho);outline-offset:3px}
  .conta{
    margin-top:1.25rem;
    padding-top:1rem;
    border-top:1px solid rgba(201,155,61,.2);
    font-size:.95rem;
  }
  .contagem{font-variant-numeric:tabular-nums;color:var(--ouro)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main class="cartao">
    <img class="brasao" src="img/branding/logo.png?v=20260809a" alt="RPG Legend">

    <h1>O jogo mudou de endereço</h1>

    <p class="forte">O RPG Legend agora fica em <strong>rpglegend.com.br</strong>.</p>

    <p>
      Esta página é a versão antiga e não funciona mais — o servidor dela foi desligado.
    </p>

    <a class="ir" id="ir" href="https://rpglegend.com.br/">Ir para o jogo</a>

    <p class="conta">
      <strong>Sua conta e seus personagens foram junto.</strong>
      Entre com o mesmo usuário e senha de sempre.
    </p>

    <p id="aviso" class="conta" hidden>
      Levando você em <span class="contagem" id="segundos">8</span>s…
    </p>
  </main>

<script>
  (function () {
    'use strict';

    // A query string vai junto. Se um link de e-mail antigo apontar pra cá
    // com `?verify=` ou `?reset=`, perder o token prenderia a conta.
    var destino = 'https://rpglegend.com.br/' + window.location.search + window.location.hash;
    var link = document.getElementById('ir');
    link.href = destino;

    // A contagem só aparece se houver JS pra cumpri-la — sem isso ela
    // prometeria algo que nunca acontece, e o botão ficaria parecendo
    // opcional quando é o único caminho.
    var aviso = document.getElementById('aviso');
    var campo = document.getElementById('segundos');
    var restam = 8;
    aviso.hidden = false;

    var relogio = setInterval(function () {
      restam -= 1;
      campo.textContent = String(restam);
      if (restam <= 0) {
        clearInterval(relogio);
        window.location.replace(destino);
      }
    }, 1000);

    // Quem clicar não precisa esperar a contagem.
    link.addEventListener('click', function () { clearInterval(relogio); });
  })();
</script>
</body>
</html>
